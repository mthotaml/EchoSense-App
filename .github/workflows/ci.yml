name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run non-infrastructure suite
        run: pytest -m "not infrastructure and not postgres and not neo4j"

  browser-lifecycle:
    name: Browser lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run lifecycle permutation suite
        run: node tests/player_lifecycle.test.js

  guardian:
    name: Guardian
    needs: [quality, unit-tests, browser-lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install Guardian dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate Guardian configuration
        run: python scripts/validate_guardian.py
      - name: Certify Spotify reference journey
        run: npm run test:e2e
      - name: Record artifact identity
        run: python scripts/release_smoke.py
      - name: Upload Guardian report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: guardian-report
          path: |
            artifacts/guardian/playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
