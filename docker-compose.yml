services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: echosense
      POSTGRES_PASSWORD: echosense
      POSTGRES_DB: echosense
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echosense"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/echosense-dev
    ports: ["7474:7474", "7687:7687"]

  redpanda:
    image: redpandadata/redpanda:v25.1.2
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr=0.0.0.0:8081
    ports: ["9092:9092", "8081:8081", "9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda-init:
    image: redpandadata/redpanda:v25.1.2
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      rpk topic create echosense.events.v1
      --brokers redpanda:29092
      --partitions 6
      --replicas 1 || true;
      rpk topic create echosense.events.dlq.v1
      --brokers redpanda:29092
      --partitions 3
      --replicas 1 || true
